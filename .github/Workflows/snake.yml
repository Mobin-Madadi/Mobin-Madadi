name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Mobin-Madadi
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Push Snake
        uses: EndBug/latest-tag@latest
        with:
          ref: output
          description: Generated contribution snake
          files: dist/github-contribution-grid-snake.svg